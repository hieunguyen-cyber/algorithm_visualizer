<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        select, button {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }

        select {
            background: white;
            cursor: pointer;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .button-group button {
            padding: 10px 15px;
            font-size: 0.9em;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }

        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: #333;
            padding: 3px;
            border: 3px solid #333;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .sudoku-cell {
            width: 40px;
            height: 40px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #ddd;
        }

        .sudoku-cell:nth-child(3n)::after {
            content: '';
            position: absolute;
            right: -2px;
            top: 0;
            width: 2px;
            height: 100%;
            background: #333;
        }

        .sudoku-cell:nth-child(n+19):nth-child(-n+27)::after,
        .sudoku-cell:nth-child(n+55):nth-child(-n+63)::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 100%;
            height: 2px;
            background: #333;
        }

        .sudoku-cell.filled {
            background: #f0f0f0;
            color: #333;
        }

        .sudoku-cell.current {
            background: #fff59d;
            box-shadow: inset 0 0 0 2px #fbc02d;
        }

        .sudoku-cell.placed {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .sudoku-cell.backtrack {
            background: #ffcdd2;
            color: #c62828;
            animation: fadeOut 0.5s ease;
        }

        .sudoku-cell.trying {
            background: #e1f5fe;
            color: #01579b;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: scale(1);
            }
            to {
                opacity: 0.5;
                transform: scale(0.95);
            }
        }

        .info-panel {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-item {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .info-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 1.3em;
            color: #333;
            margin-top: 5px;
            font-family: 'Courier New', monospace;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border-top: 3px solid #667eea;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .steps-visualizer {
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow-y: auto;
            background: #fafafa;
            padding: 10px;
            margin-top: 15px;
        }

        .step-item {
            padding: 8px;
            margin-bottom: 5px;
            background: white;
            border-left: 3px solid #ddd;
            border-radius: 3px;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
            transition: all 0.2s ease;
        }

        .step-item.active {
            background: #fff9c4;
            border-left-color: #fbc02d;
            transform: translateX(5px);
        }

        .step-item.completed {
            border-left-color: #66bb6a;
            color: #2e7d32;
        }

        .status {
            text-align: center;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: 600;
            color: #666;
        }

        .status.success {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffcdd2;
            color: #c62828;
        }

        .status.solving {
            background: #e1f5fe;
            color: #01579b;
        }

        .spinner {
            display: inline-block;
            width: 15px;
            height: 15px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .sudoku-grid {
                max-width: 300px;
            }

            .sudoku-cell {
                width: 30px;
                height: 30px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Sudoku Solver Visualizer</h1>
        <p class="subtitle">Visualize different solving algorithms in action</p>

        <div class="controls">
            <div class="control-group">
                <label for="algorithm">Solving Algorithm</label>
                <select id="algorithm">
                    <option value="backtracking">Backtracking</option>
                    <option value="forward-checking">Forward Checking</option>
                    <option value="mrv">MRV (Minimum Remaining Values)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="speed">Animation Speed</label>
                <select id="speed">
                    <option value="fast">Fast (10ms)</option>
                    <option value="normal" selected>Normal (100ms)</option>
                    <option value="slow">Slow (500ms)</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button id="loadBtn" onclick="loadPuzzle()">Load Puzzle</button>
            <button id="startBtn" onclick="startSudoku()">Start</button>
            <button id="resetBtn" onclick="resetBoard()">Reset</button>
        </div>

        <div class="main-content">
            <div class="board-container">
                <h3>Sudoku Board</h3>
                <div id="sudokuGrid" class="sudoku-grid"></div>
                <div class="status" id="status">Ready to solve</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div>
                <h3>Solving Information</h3>
                <div class="info-panel">
                    <div class="stats-row">
                        <div class="stat-box">
                            <div class="stat-value" id="nodeCount">0</div>
                            <div class="stat-label">Nodes Explored</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value" id="stepCount">0</div>
                            <div class="stat-label">Steps Taken</div>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Time Elapsed</div>
                        <div class="info-value" id="timeElapsed">0ms</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Current Step</div>
                        <div class="info-value" id="currentStep">-</div>
                    </div>

                    <div class="info-item">
                        <div class="info-label">Algorithm</div>
                        <div class="info-value" id="algorithmName">-</div>
                    </div>

                    <h4 style="margin-top: 20px; margin-bottom: 10px;">Solving Steps</h4>
                    <div class="steps-visualizer" id="stepsVisualizerContainer">
                        <p style="color: #999; text-align: center; padding: 20px;">Steps will appear here</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample Sudoku puzzles for testing
        const samplePuzzles = [
            // Easy puzzle
            [
                [5,3,0,0,7,0,0,0,0],
                [6,0,0,1,9,5,0,0,0],
                [0,9,8,0,0,0,0,6,0],
                [8,0,0,0,6,0,0,0,3],
                [4,0,0,8,0,3,0,0,1],
                [7,0,0,0,2,0,0,0,6],
                [0,6,0,0,0,0,2,8,0],
                [0,0,0,4,1,9,0,0,5],
                [0,0,0,0,8,0,0,7,9]
            ],
            // Medium puzzle
            [
                [3,0,6,5,0,8,4,0,0],
                [5,2,0,0,0,0,0,0,0],
                [0,8,7,0,0,0,0,3,1],
                [0,0,3,0,1,0,0,8,0],
                [9,0,0,8,6,3,0,0,5],
                [0,5,0,0,9,0,6,0,0],
                [1,3,0,0,0,0,2,5,0],
                [0,0,0,0,0,0,0,7,4],
                [0,0,5,2,0,6,3,0,0]
            ]
        ];

        let currentBoard = null;
        let solverState = {
            solving: false,
            paused: false,
            steps: [],
            currentStepIndex: -1,
            nodeCount: 0,
            timeElapsed: 0
        };

        function initializeGrid() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 81; i++) {
                const cell = document.createElement('div');
                cell.className = 'sudoku-cell';
                cell.id = `cell-${i}`;
                cell.addEventListener('click', () => selectCell(i));
                grid.appendChild(cell);
            }
        }

        function loadPuzzle() {
            console.log('📦 loadPuzzle() called');
            const puzzle = samplePuzzles[Math.floor(Math.random() * samplePuzzles.length)];
            currentBoard = puzzle.map(row => [...row]);
            console.log('✓ Puzzle loaded, empty cells:', currentBoard.flat().filter(v => v === 0).length);
            renderBoard();
            solverState = {
                solving: false,
                paused: false,
                steps: [],
                currentStepIndex: -1,
                nodeCount: 0,
                timeElapsed: 0
            };
            updateStats();
            updateStatus('✅ Puzzle loaded. Click "Start" to solve!', 'success');
        }

        function renderBoard() {
            console.log('🎨 renderBoard() called');
            for (let i = 0; i < 81; i++) {
                const row = Math.floor(i / 9);
                const col = i % 9;
                const cell = document.getElementById(`cell-${i}`);
                const value = currentBoard[row][col];
                
                cell.textContent = value !== 0 ? value : '';
                cell.className = 'sudoku-cell';
                
                if (value !== 0) {
                    cell.classList.add('filled');
                }
            }
            console.log('✓ Board rendered');
        }

        function updateStats() {
            console.log('📊 updateStats() called');
            document.getElementById('nodeCount').textContent = solverState.nodeCount;
            document.getElementById('stepCount').textContent = solverState.steps.length;
            document.getElementById('timeElapsed').textContent = solverState.timeElapsed + 'ms';
            document.getElementById('algorithmName').textContent = 
                document.getElementById('algorithm').options[document.getElementById('algorithm').selectedIndex].text;
            console.log('✓ Stats updated');
        }

        function updateStatus(message, type = 'default') {
            console.log(`📢 Status: [${type}] ${message}`);
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }

        async function startSudoku() {
            console.log('🚀 startSudoku() called');
            
            // 1. VALIDATE STATE
            if (!currentBoard) {
                console.error('❌ currentBoard is null/undefined');
                updateStatus('⚠️ Please load a puzzle first', 'error');
                return;
            }

            console.log('📋 Current board:', currentBoard);

            // 2. PREVENT MULTIPLE SOLVES
            if (solverState.solving) {
                console.warn('⚠️ Already solving, ignoring click');
                updateStatus('⏳ Already solving...', 'solving');
                return;
            }

            // 3. VALIDATE BOARD CONFIGURATION
            console.log('🔍 Validating board...');
            const validationRequest = JSON.stringify({ board: currentBoard });
            
            try {
                const validationResponse = await fetch('http://localhost:8080/api/sudoku/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: validationRequest
                });

                console.log('📡 Validation response status:', validationResponse.status);
                const validationResult = await validationResponse.json();
                console.log('✓ Validation result:', validationResult);

                if (!validationResult.success) {
                    console.error('❌ Board validation failed:', validationResult.error);
                    updateStatus('❌ Invalid puzzle: ' + validationResult.error, 'error');
                    return;
                }

                console.log('✅ Board validation passed');
            } catch (validationError) {
                console.error('❌ Validation error:', validationError);
                updateStatus('❌ Server error: ' + validationError.message, 'error');
                return;
            }

            // 4. START SOLVING
            console.log('🧩 Starting solver...');
            solverState.solving = true;
            updateStatus('⏳ Solving...', 'solving');

            try {
                // 4a. GET ALGORITHM SELECTION
                const algorithm = document.getElementById('algorithm').value;
                console.log('🔧 Algorithm selected:', algorithm);

                // 4b. BUILD REQUEST
                const solveRequest = {
                    board: currentBoard,
                    algorithm: algorithm
                };
                console.log('📤 Solve request:', solveRequest);

                // 4c. CALL SOLVER API
                console.log('📡 Calling /api/sudoku/solve-with-steps...');
                const solveResponse = await fetch('http://localhost:8080/api/sudoku/solve-with-steps', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(solveRequest)
                });

                console.log('📡 Solve response status:', solveResponse.status);

                if (!solveResponse.ok) {
                    console.error('❌ Server returned error:', solveResponse.status, solveResponse.statusText);
                    updateStatus('❌ Server error: ' + solveResponse.statusText, 'error');
                    solverState.solving = false;
                    return;
                }

                // 4d. PARSE RESPONSE
                const solveResult = await solveResponse.json();
                console.log('📥 Solve result:', solveResult);

                if (!solveResult.success) {
                    console.error('❌ Solver failed:', solveResult.error);
                    updateStatus('❌ Solver error: ' + solveResult.error, 'error');
                    solverState.solving = false;
                    return;
                }

                // 5. STORE RESULTS
                console.log('💾 Storing solver results...');
                solverState.steps = solveResult.steps || [];
                solverState.nodeCount = solveResult.nodeCount || 0;
                solverState.timeElapsed = solveResult.elapsedMs || 0;
                
                console.log('📊 Steps count:', solverState.steps.length);
                console.log('📊 Nodes explored:', solverState.nodeCount);
                console.log('📊 Time elapsed:', solverState.timeElapsed + 'ms');

                // 6. UPDATE BOARD WITH SOLUTION
                if (solveResult.board) {
                    console.log('🔄 Updating board with solution');
                    currentBoard = solveResult.board;
                } else {
                    console.warn('⚠️ No solution board returned');
                }

                // 7. UPDATE STATS
                console.log('📈 Updating stats...');
                updateStats();

                // 8. ANIMATE SOLUTION
                console.log('🎬 Starting visualization animation...');
                await visualizeSteps();

                // 9. COMPLETION
                console.log('✅ Solving complete!');
                updateStatus('✅ Puzzle solved in ' + solverState.timeElapsed + 'ms!', 'success');

            } catch (error) {
                console.error('❌ Error during solving:', error);
                console.error('Error type:', error.constructor.name);
                console.error('Error message:', error.message);
                console.error('Error stack:', error.stack);
                updateStatus('❌ Error: ' + error.message, 'error');
            } finally {
                console.log('🏁 Solver finished (finally block)');
                solverState.solving = false;
            }
        }

        // ALIAS FOR BACKWARD COMPATIBILITY
        async function solvePuzzle() {
            console.log('⚠️ solvePuzzle() called (deprecated), redirecting to startSudoku()');
            await startSudoku();
        }

        async function visualizeSteps() {
            console.log('🎬 visualizeSteps() started');
            
            // Get animation speed
            const speedKey = document.getElementById('speed').value;
            const speed = {
                'fast': 10,
                'normal': 100,
                'slow': 500
            }[speedKey] || 100;
            
            console.log('⏱️ Animation speed:', speed + 'ms');
            console.log('📊 Total steps to visualize:', solverState.steps.length);

            const container = document.getElementById('stepsVisualizerContainer');
            container.innerHTML = '';

            // VISUALIZE EACH STEP
            for (let i = 0; i < solverState.steps.length; i++) {
                const step = solverState.steps[i];
                
                console.log(`\n📍 Step ${i+1}/${solverState.steps.length}:`, step);

                // 1. CREATE STEP DISPLAY
                const stepDiv = document.createElement('div');
                stepDiv.className = 'step-item';
                stepDiv.textContent = `[${i+1}] ${formatStep(step)}`;
                container.appendChild(stepDiv);
                console.log(`   ✓ Step display created`);

                // 2. ANIMATE CELL (if applicable)
                if (step.row >= 0 && step.col >= 0) {
                    const cellIndex = step.row * 9 + step.col;
                    const cell = document.getElementById(`cell-${cellIndex}`);
                    
                    if (!cell) {
                        console.warn(`   ⚠️ Cell not found: cell-${cellIndex}`);
                    } else {
                        console.log(`   🎨 Animating cell [${step.row},${step.col}] (index ${cellIndex})`);
                        
                        // Clear previous highlights
                        document.querySelectorAll('.sudoku-cell').forEach(c => {
                            c.classList.remove('current');
                        });
                        
                        // Apply action-specific styling
                        if (step.action === 'placed') {
                            console.log(`   ✅ PLACED: ${step.value}`);
                            cell.textContent = step.value;
                            cell.classList.add('placed', 'current');
                        } else if (step.action === 'backtrack') {
                            console.log(`   🔙 BACKTRACK`);
                            cell.textContent = '';
                            cell.classList.add('backtrack', 'current');
                        } else if (step.action === 'trying') {
                            console.log(`   🤔 TRYING: ${step.candidates?.join(',') || '?'}`);
                            cell.classList.add('trying', 'current');
                        } else if (step.action === 'solved') {
                            console.log(`   🎉 SOLVED`);
                        }

                        // 3. HIGHLIGHT ACTIVE STEP IN LOG
                        const allSteps = document.querySelectorAll('.step-item');
                        allSteps.forEach(si => si.classList.remove('active'));
                        if (i < allSteps.length) {
                            allSteps[i].classList.add('active');
                            console.log(`   📜 Highlighted step in log`);
                        }
                    }

                    // 4. UPDATE PROGRESS BAR
                    const progress = ((i + 1) / solverState.steps.length) * 100;
                    document.getElementById('progressFill').style.width = progress + '%';
                    console.log(`   📊 Progress: ${progress.toFixed(1)}%`);
                }

                // 5. WAIT FOR ANIMATION SPEED
                console.log(`   ⏵️  Waiting ${speed}ms...`);
                await new Promise(resolve => setTimeout(resolve, speed));
            }

            // FINAL RENDER
            console.log('\n🎯 Final render...');
            renderBoard();
            document.getElementById('progressFill').style.width = '100%';
            console.log('✅ visualizeSteps() completed');
        }

        function formatStep(step) {
            if (step.action === 'solved') {
                return '🎉 Puzzle solved!';
            }
            if (step.action === 'placed') {
                return `Place ${step.value} at [${step.row}, ${step.col}]`;
            }
            if (step.action === 'backtrack') {
                return `Backtrack from [${step.row}, ${step.col}]`;
            }
            if (step.action === 'trying') {
                const candidates = step.candidates ? step.candidates.join(',') : '?';
                return `Try candidates [${candidates}] at [${step.row}, ${step.col}]`;
            }
            return `Action: ${step.action} at [${step.row}, ${step.col}]`;
        }

        function resetBoard() {
            console.log('🔄 resetBoard() called');
            loadPuzzle();
            updateStatus('♻️ Board reset', 'default');
        }

        function selectCell(index) {
            // For future interactive input
            console.log('Selected cell:', index);
        }

        // HEALTH CHECK - Verify backend is accessible
        async function checkBackendHealth() {
            console.log('💓 Checking backend health...');
            try {
                const response = await fetch('http://localhost:8080/health', {
                    method: 'GET',
                    timeout: 5000
                });
                const result = await response.json();
                console.log('✅ Backend is healthy:', result);
                updateStatus('✅ Backend connected (8080)', 'success');
                return true;
            } catch (error) {
                console.error('❌ Backend not accessible:', error.message);
                updateStatus('❌ Backend not found: http://localhost:8080', 'error');
                console.error('Make sure the backend server is running:');
                console.error('  Command: java -jar target/algorithm-visualizer-1.0.0.jar');
                return false;
            }
        }

        // Initialize on load
        window.addEventListener('load', async () => {
            console.log('🌍 Window load event triggered');
            console.log('📍 Current URL:', window.location.href);
            console.log('🔗 Expected API base: http://localhost:8080');
            
            // Initialize grid
            console.log('🔨 Initializing grid...');
            initializeGrid();
            
            // Load default puzzle
            console.log('📦 Loading default puzzle...');
            loadPuzzle();
            
            // Check backend health
            console.log('\n🏥 Performing health check...');
            await checkBackendHealth();
            
            // BIND EVENT LISTENERS MANUALLY FOR COMPATIBILITY
            console.log('\n🔗 Binding event listeners...');
            const startBtn = document.getElementById('startBtn');
            const loadBtn = document.getElementById('loadBtn');
            const resetBtn = document.getElementById('resetBtn');
            
            if (startBtn) {
                console.log('✓ Start button found, binding click event');
                startBtn.addEventListener('click', () => {
                    console.log('🖱️ Start button clicked!');
                    startSudoku();
                });
            } else {
                console.error('❌ Start button not found!');
            }
            
            if (loadBtn) {
                console.log('✓ Load button found');
                loadBtn.addEventListener('click', () => {
                    console.log('🖱️ Load button clicked!');
                    loadPuzzle();
                });
            } else {
                console.error('❌ Load button not found!');
            }
            
            if (resetBtn) {
                console.log('✓ Reset button found');
                resetBtn.addEventListener('click', () => {
                    console.log('🖱️ Reset button clicked!');
                    resetBoard();
                });
            } else {
                console.error('❌ Reset button not found!');
            }
            
            console.log('\n✅ Initialization complete!');
            console.log('💡 Tip: Open browser console (F12) to see debug messages');
            console.log('💡 Tip: Click "Load Puzzle" then "Start" to begin solving');
        });
    </script>
</body>
</html>
